# Render blueprint for the FillMyPDF cloud converter.
# Deploy: push to your repo, then in Render → "New +" → "Blueprint" and point it
# at this file (or set Root Directory = cloud_convert for a manual Docker web service).
#
# IMPORTANT: the YOLO model needs real RAM. Free/Starter (512 MB) will OOM —
# use "standard" (2 GB) or larger. Use "pro" / a GPU host for FFDNet-L.
services:
  - type: web
    name: fillmypdf-converter
    runtime: docker
    rootDir: cloud_convert
    dockerfilePath: ./Dockerfile
    plan: standard            # >= 2 GB RAM; do NOT use free/starter for torch
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONVERT_API_KEY          # clients send this as X-Convert-Key
        generateValue: true           # Render generates a strong secret
      - key: COMMONFORMS_MODEL
        value: FFDNet-S               # small model; FFDNet-L needs more RAM/GPU
      - key: COMMONFORMS_FAST
        value: "true"                 # ONNX CPU path (lower memory)
      - key: COMMONFORMS_IMAGE_SIZE
        value: "1024"
      - key: CONVERT_MAX_PAGES
        value: "40"
      - key: CONVERT_MAX_UPLOAD_MB
        value: "25"
