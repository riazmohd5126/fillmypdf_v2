    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',

      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        if (isPageRoot || window.parent === window) return; // authoritative miss

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x\">ID: <span style=\"font:600 9px/1.3 Arial,sans-serif;color:#1130c8\">CT8840321<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr\">\n<div style=\"padding:3px 5px;border-right:1px solid #111\">Drug: <span style=\"font:600 9px/1.3 Arial,sans-serif;color:#1130c8\">Xolair 150mg/mL<\u002Fspan><\u002Fdiv>\n<div style=\"padding:3px 5px;position:relative\">Qty: <span style=\"font:600 9px/1.3 Arial,sans-serif;color:#1130c8\">{{ typed }}<\u002Fspan><span style=\"position:absolute;left:-5px;right:-5px;top:-4px;bottom:-4px;border:1.5px solid #4f46e5;border-radius:3px;background:rgba(79,70,229,.06)\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:8px;border:1px solid #111;font:400 8.5px/1.35 'Times New Roman',serif\">\n<div style=\"display:grid;grid-template-columns:1fr 74px;border-bottom:1px solid #111\">\n<div style=\"padding:3px 5px;border-right:1px solid #111\"><b>Moderate-to-Severe Persistent Asthma (6+ yrs):<\u002Fb> positive aeroallergen reactivity, not controlled on ICS?<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-around;font-weight:700\"><span>☒Yes<\u002Fspan><span>☐No<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 74px\">\n<div style=\"padding:3px 5px;border-right:1px solid #111\"><b>Chronic Spontaneous Urticaria (12+ yrs):<\u002Fb> symptomatic despite H1 antihistamine?<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-around;font-weight:700\"><span>☐Yes<\u002Fspan><span>☒No<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:9px;display:flex;align-items:baseline;gap:6px;font:700 8.5px/1.4 'Times New Roman',serif\">Signature<span style=\"flex:1;border-bottom:1px solid #111;font:400 13px/1.1 'Segoe Script','Brush Script MT',cursive;color:#1130c8;text-align:center\">Rajiv Shah<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:13px;display:flex;flex-direction:column;gap:7px;background:#fff\">\n<div style=\"display:flex;align-items:center;gap:6px;padding-bottom:2px\">\n<div style=\"width:5px;height:5px;border-radius:50%;background:#4f46e5\"><\u002Fdiv>\n<div style=\"font:600 10px/1 Manrope,sans-serif;color:#7b776f\">Autofilled 7 fields from your profiles<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ mockRows }}\" as=\"m\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;align-items:center;gap:8px;min-height:32px;border-top:1px solid #f4f1eb;padding-top:5px\">\n<div style=\"width:3px;height:18px;border-radius:2px;background:{{ m.mark }};flex:none\"><\u002Fdiv>\n<div style=\"flex:1;min-width:0;font:600 10.5px/1.25 Manrope,sans-serif;color:#3d3a34\">{{ m.label }}<\u002Fdiv>\n<sc-if value=\"{{ m.isYN }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:none;display:flex;border:1px solid #e4e0d8;border-radius:7px;overflow:hidden\">\n<div style=\"width:38px;height:26px;display:flex;align-items:center;justify-content:center;font:700 10px/1 Manrope,sans-serif;background:{{ m.yBg }};color:{{ m.yFg }};border-right:1px solid #eeeae2\">Yes<\u002Fdiv>\n<div style=\"width:38px;height:26px;display:flex;align-items:center;justify-content:center;font:700 10px/1 Manrope,sans-serif;background:{{ m.nBg }};color:{{ m.nFg }}\">No<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ m.isText }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex:none;width:104px;height:26px;border:1px solid {{ m.bd }};border-radius:7px;background:{{ m.bg }};display:flex;align-items:center;padding:0 8px;font:600 10.5px/1 Manrope,sans-serif;color:#15171c;overflow:hidden;white-space:nowrap\">{{ m.value }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"margin-top:auto;padding-top:8px;display:flex;gap:6px\">\n<div style=\"flex:none;height:32px;padding:0 10px;border-radius:8px;border:1px solid #e0dcd3;display:flex;align-items:center;font:700 10.5px/1 Manrope,sans-serif;color:#4f46e5\">Next unfilled<\u002Fdiv>\n<div style=\"flex:1;height:32px;border-radius:8px;background:#4f46e5;display:flex;align-items:center;justify-content:center;font:800 11px/1 Manrope,sans-serif;color:#fff\">Fill, preview &amp; sign<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;margin-top:12px;display:flex;align-items:center;gap:8px;justify-content:center\">\n<div style=\"width:7px;height:7px;border-radius:50%;background:#4f46e5;flex:none\"><\u002Fdiv>\n<div style=\"font:600 12px/1.4 Manrope,sans-serif;color:#7b776f\">{{ heroCaption }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:12px 24px 64px\">\n<div style=\"max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:26px\">\n<div style=\"max-width:600px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font:700 11px/1 'JetBrains Mono',monospace;color:#a8a49b;letter-spacing:1.4px\">WHERE THE HOURS GO<\u002Fdiv>\n<h2 style=\"margin:0;font:800 clamp(27px,3vw,38px)/1.1 Manrope,sans-serif;letter-spacing:-1.1px;text-wrap:balance\">The form is never the hard part. The repetition is.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))\">\n<sc-for list=\"{{ pains }}\" as=\"p\" hint-placeholder-count=\"4\">\n<div style=\"padding:20px;border:1px solid #e9e5dd;border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:9px\">\n<div style=\"width:30px;height:30px;border-radius:9px;background:#f6f5ff;border:1px solid #e6e4ff;display:flex;align-items:center;justify-content:center;font:800 12px/1 'JetBrains Mono',monospace;color:#4f46e5\">{{ p.n }}<\u002Fdiv>\n<div style=\"font:700 14px/1.3 Manrope,sans-serif;color:#15171c;text-wrap:pretty\">{{ p.t }}<\u002Fdiv>\n<div style=\"font:500 12.5px/1.5 Manrope,sans-serif;color:#7b776f;text-wrap:pretty\">{{ p.d }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"how\" style=\"padding:64px 24px;background:#15171c;color:#fff\">\n<div style=\"max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:34px\">\n<div style=\"max-width:620px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font:700 11px/1 'JetBrains Mono',monospace;color:#8b86ff;letter-spacing:1.4px\">HOW IT WORKS<\u002Fdiv>\n<h2 style=\"margin:0;font:800 clamp(27px,3vw,38px)/1.1 Manrope,sans-serif;letter-spacing:-1.1px;color:#fff;text-wrap:balance\">Three steps, and the third one is usually already done.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))\">\n<sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n<div style=\"padding:22px;border:1px solid #2c2f38;border-radius:16px;background:#1d2029;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:9px\">\n<div style=\"width:24px;height:24px;border-radius:7px;background:#4f46e5;display:flex;align-items:center;justify-content:center;font:800 11px/1 Manrope,sans-serif;color:#fff\">{{ s.n }}<\u002Fdiv>\n<div style=\"font:800 14.5px/1 Manrope,sans-serif;color:#fff\">{{ s.t }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:500 13px/1.55 Manrope,sans-serif;color:#a7a49d;text-wrap:pretty\">{{ s.d }}<\u002Fdiv>\n<div style=\"margin-top:2px;padding:11px;border-radius:11px;background:#14161d;border:1px solid #2c2f38;font:600 11px/1.5 'JetBrains Mono',monospace;color:#8b86ff;text-wrap:pretty\">{{ s.code }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"forms\" style=\"padding:64px 24px\">\n<div style=\"max-width:1160px;margin:0 auto;display:grid;gap:44px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start\">\n<div style=\"min-width:0;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:700 11px/1 'JetBrains Mono',monospace;color:#a8a49b;letter-spacing:1.4px\">FORM LIBRARY<\u002Fdiv>\n<h2 style=\"margin:0;font:800 clamp(27px,3vw,38px)/1.1 Manrope,sans-serif;letter-spacing:-1.1px;text-wrap:balance\">Your payers' forms, already mapped.<\u002Fh2>\n<p style=\"margin:0;font:500 15.5px/1.6 Manrope,sans-serif;color:#5b5750;max-width:480px;text-wrap:pretty\">Every form is mapped once and locked, so a filled field can't drift onto the wrong line after a payer reissues the PDF. Drop in a form we don't have and we map it for you.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px;padding-top:4px\">\n<sc-for list=\"{{ libFeat }}\" as=\"f\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;gap:10px;align-items:flex-start\">\n<div style=\"width:16px;height:16px;flex:none;margin-top:2px;border-radius:50%;background:#eeedff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font:800 9px/1 Manrope,sans-serif\">✓<\u002Fdiv>\n<div style=\"font:500 13.5px/1.5 Manrope,sans-serif;color:#3d3a34;text-wrap:pretty\"><b style=\"font-weight:700\">{{ f.t }}<\u002Fb> — {{ f.d }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0;border:1px solid #e9e5dd;border-radius:16px;background:#fff;overflow:hidden\">\n<div style=\"padding:12px 14px;border-bottom:1px solid #eeeae2;background:#fbfaf8;display:flex;align-items:center;gap:9px\">\n<div style=\"font:700 11px/1 'JetBrains Mono',monospace;color:#a8a49b;letter-spacing:1px\">24 FORMS<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"font:700 10.5px/1 Manrope,sans-serif;color:#2f6b48;background:#e8f3ec;padding:5px 8px;border-radius:6px\">Mapping locked<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ libRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #f4f1eb\">\n<div style=\"min-width:0;flex:1;display:flex;flex-direction:column;gap:3px\">\n<div style=\"font:700 12.5px/1.25 Manrope,sans-serif;color:#15171c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fdiv>\n<div style=\"font:500 10.5px/1 Manrope,sans-serif;color:#a8a49b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.meta }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:none;font:700 9.5px/1 'JetBrains Mono',monospace;color:{{ r.fg }};background:{{ r.bg }};padding:5px 7px;border-radius:5px\">{{ r.tag }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:12px 14px;font:600 12px/1 Manrope,sans-serif;color:#4f46e5\">+ 18 more across 9 payers<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"faq\" style=\"padding:0 24px 72px\">\n<div style=\"max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px\">\n<h2 style=\"margin:0;font:800 clamp(25px,2.6vw,33px)/1.1 Manrope,sans-serif;letter-spacing:-1px\">Questions filling teams ask<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n<div style=\"border:1px solid #e9e5dd;border-radius:13px;background:#fff;overflow:hidden\">\n<div sc-camel-on-click=\"{{ f.toggle }}\" style=\"display:flex;align-items:center;gap:12px;padding:15px 17px;cursor:pointer\">\n<div style=\"flex:1;font:700 14px/1.4 Manrope,sans-serif;color:#15171c;text-wrap:pretty\">{{ f.q }}<\u002Fdiv>\n<div style=\"flex:none;width:20px;text-align:center;font:700 14px/1 Manrope,sans-serif;color:#a8a49b\">{{ f.sign }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:0 17px 16px;font:500 13.5px/1.6 Manrope,sans-serif;color:#5b5750;max-width:660px;text-wrap:pretty\">{{ f.a }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 24px 72px\">\n<div style=\"max-width:1160px;margin:0 auto;padding:clamp(30px,4vw,52px);border-radius:20px;background:linear-gradient(140deg,#4f46e5,#372fc0 60%,#241f8f);color:#fff;display:flex;flex-direction:column;gap:20px;align-items:flex-start\">\n<h2 style=\"margin:0;max-width:660px;font:800 clamp(27px,3.2vw,40px)/1.08 Manrope,sans-serif;letter-spacing:-1.3px;color:#fff;text-wrap:balance\">See one of your own forms filled in the demo.<\u002Fh2>\n<p style=\"margin:0;max-width:520px;font:500 15.5px/1.55 Manrope,sans-serif;color:#dcd9ff\">Send the PDF you fill most often. We map it before the call and you leave with it working.<\u002Fp>\n<div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n<button sc-camel-on-click=\"{{ focusCta }}\" style=\"height:48px;padding:0 22px;border-radius:11px;border:none;background:#fff;color:#3a31b8;font:800 14.5px/1 Manrope,sans-serif;cursor:pointer\">Book a 15-min demo<\u002Fbutton>\n<button sc-camel-on-click=\"{{ focusCta }}\" style=\"height:48px;padding:0 22px;border-radius:11px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:700 14.5px/1 Manrope,sans-serif;cursor:pointer\">Send us a form to map<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font:600 12px/1 Manrope,sans-serif;color:#bdb8ff\">No card. No implementation project. Works on the forms you already use.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 24px 40px\">\n<div style=\"max-width:1160px;margin:0 auto;padding-top:24px;border-top:1px solid #e9e5dd;display:flex;gap:18px;flex-wrap:wrap;align-items:center\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<div style=\"width:22px;height:22px;border-radius:6px;background:linear-gradient(150deg,#6f78ff,#4b41d6)\"><\u002Fdiv>\n<div style=\"font:800 13px/1 Manrope,sans-serif\">Fill My PDF<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n<a href=\"#how\" style=\"font:600 12px/1 Manrope,sans-serif;color:#8b877e\">Product<\u002Fa>\n<a href=\"./Login Page Options.dc.html\" style=\"font:600 12px/1 Manrope,sans-serif;color:#8b877e\">Sign in<\u002Fa>\n<a href=\"#faq\" style=\"font:600 12px/1 Manrope,sans-serif;color:#8b877e\">FAQ<\u002Fa>\n<div style=\"font:500 12px/1 Manrope,sans-serif;color:#b3aea3\">© 2026 Fill My PDF<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;category&quot;,&quot;automation&quot;,&quot;payer&quot;,&quot;specialty&quot;],&quot;default&quot;:&quot;category&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero variant&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero variant&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {email:'', sent:false, err:false, faq:0, typed:''};\n    // One template, many top folds. Everything below the hero is shared.\n    // A new variant = one entry here. Read from ?v=<key> or the \"variant\" prop.\n    this.VARIANTS = {\n      category: {\n        eyebrow: 'For prior authorization teams',\n        h1: 'Watch it land on the real page.',\n        sub: \"Fill My PDF turns any payer's prior authorization PDF into a guided form. Your saved profiles fill the repeating fields, you answer only what's clinical, and every keystroke renders onto the real payer page as you type.\",\n        ticks: ['Works on any payer PDF', 'Profiles autofill the repeats', 'E-signature included'],\n        cta: 'Book a demo',\n        navCta: 'Book a 15-min demo',\n        mockTitle: 'XOLAIR (omalizumab) — CT Medicaid PA',\n        mockBadge: '8 of 9 filled',\n        caption: \"Live overlay — every keystroke lands on the payer's real page, so there is nothing to proofread later.\"\n      },\n      automation: {\n        eyebrow: 'Prior authorization automation',\n        h1: 'Fill one form for the whole worklist.',\n        sub: 'Map a payer form once, then fill it for every row of a CSV in a single pass. Identity fields come from saved profiles; you answer only the clinical questions that differ.',\n        ticks: ['Batch from CSV', 'Mappings versioned and locked', 'One flattened PDF per row'],\n        cta: 'See a batch run',\n        navCta: 'See a batch run',\n        mockTitle: 'Batch · 42 rows — CT Medicaid PA',\n        mockBadge: '42 of 42 filled',\n        caption: 'One mapped form, one CSV, forty-two finished PDFs — each one logged.'\n      },\n      payer: {\n        eyebrow: 'Aetna prior authorization',\n        h1: 'Your Aetna forms, already mapped.',\n        sub: \"Aetna's prior authorization PDFs are mapped and locked in the library. Open one, and the prescriber, member and facility fields are already filled from your profiles.\",\n        ticks: ['Aetna forms mapped and locked', 'Profiles autofill the repeats', 'E-signature included'],\n        cta: 'Book a demo',\n        navCta: 'Book a 15-min demo',\n        mockTitle: 'aetna az-prescription-drug PA',\n        mockBadge: '8 of 9 filled',\n        caption: \"Live overlay — every keystroke lands on Aetna's real page, so there is nothing to proofread later.\"\n      },\n      specialty: {\n        eyebrow: 'For specialty pharmacy teams',\n        h1: 'Specialty PAs without the retyping.',\n        sub: 'Biologic authorizations mean the same identity block and the same clinical criteria, over and over. Profiles handle the repeats; the guided pane asks only the drug-specific questions.',\n        ticks: ['Biologic PA forms mapped', 'Clinical criteria as one-line questions', 'E-signature included'],\n        cta: 'Book a demo',\n        navCta: 'Book a 15-min demo',\n        mockTitle: 'XOLAIR (omalizumab) — CT Medicaid PA',\n        mockBadge: '8 of 9 filled',\n        caption: 'Live overlay — the criteria answers land on the payer page as you pick them.'\n      }\n    };\n    this.TYPE = '2 syringes';\n  }\n  componentDidMount() {\n    let i = 0;\n    this.t = setInterval(() => {\n      i++;\n      if (i > this.TYPE.length + 14) { i = 0; }\n      this.setState({typed: this.TYPE.slice(0, Math.min(i, this.TYPE.length))});\n    }, 190);\n  }\n  componentWillUnmount() { clearInterval(this.t); }\n\n  renderVals() {\n    const st = this.state;\n    const ok = /.+@.+\\..+/.test(st.email.trim());\n    const key = this.props.variant ?? new URLSearchParams(location.search).get('v') ?? 'category';\n    const v = this.VARIANTS[key] || this.VARIANTS.category;\n    const cta = this.props.ctaLabel || v.cta;\n    return {\n      email: st.email, ctaLabel: st.sent ? 'Sent ✓' : cta,\n      onEmail: e => this.setState({email:e.target.value, err:false, sent:false}),\n      emailKey: e => { if (e.key === 'Enter') this.submit(ok); },\n      submitEmail: () => this.submit(ok),\n      inBd: st.err ? '#d98a2b' : '#e0dcd3',\n      note: st.sent ? 'Thanks — we will email two times that work within the hour.'\n        : (st.err ? 'That address does not look right.' : 'Or reply to the confirmation with the form you want mapped first.'),\n      noteFg: st.sent ? '#2f6b48' : (st.err ? '#a1622a' : '#a8a49b'),\n      focusCta: () => { const el = document.querySelector('[data-cta-input]'); if (el) { el.focus(); window.scrollTo({top:0, behavior:'smooth'}); } },\n      typed: st.typed,\n\n      heroEyebrow: v.eyebrow, heroH1: v.h1, heroSub: v.sub, heroCaption: v.caption,\n      navCta: v.navCta, mockTitle: v.mockTitle, mockBadge: v.mockBadge,\n      ticks: v.ticks.map(label => ({label})),\n\n      mockRows: [\n        {label:'Prescriber', value:'Shah, Rajiv', isText:true, mark:'#4f46e5', bd:'#e0dcd3', bg:'#f7f6ff'},\n        {label:'Member ID', value:'CT8840321', isText:true, mark:'#4f46e5', bd:'#e0dcd3', bg:'#f7f6ff'},\n        {label:'Quantity requested', value:st.typed || '—', isText:true, mark:'#4f46e5', bd:'#4f46e5', bg:'#fff'},\n        {label:'Persistent asthma, 6+', isYN:true, mark:'#4f46e5', yBg:'#4f46e5', yFg:'#fff', nBg:'#fff', nFg:'#7b776f'},\n        {label:'Spontaneous urticaria, 12+', isYN:true, mark:'#4f46e5', yBg:'#fff', yFg:'#7b776f', nBg:'#3d3a34', nFg:'#fff'}\n      ],\n\n      pains: [\n        {n:'01', t:'The same eight fields, every single time', d:'Prescriber, NPI, member ID, DOB. Different boxes on every payer\\u2019s layout.'},\n        {n:'02', t:'PDFs that fight back', d:'Flattened scans, misaligned form fields, text that lands two lines below where it should.'},\n        {n:'03', t:'Rejections for the avoidable stuff', d:'A transposed member ID or a missed clinical checkbox sends the whole thing back.'},\n        {n:'04', t:'No trail of who filled what', d:'When a payer calls, nobody can say which version was faxed or who signed it.'}\n      ],\n\n      steps: [\n        {n:'1', t:'Pick the form', d:'Search 24 mapped payer forms, or drop in a PDF and we map its fields for you.', code:'ctdssmap · XOLAIR PA · mapping locked'},\n        {n:'2', t:'Answer only what is clinical', d:'Profiles fill the repeating identity fields the moment the form opens. The guided pane asks the rest as one-line questions, and the real page fills in live beside you.', code:'7 fields autofilled · 2 questions left'},\n        {n:'3', t:'Sign and send', d:'Sign electronically, export the flattened PDF, or send it straight to the payer\\u2019s fax line. Every fill is logged.', code:'signed · exported · logged 10:42'}\n      ],\n\n      libFeat: [\n        {t:'Locked mappings', d:'field positions are versioned, so a reissued PDF never silently shifts your data'},\n        {t:'Batch from CSV', d:'fill the same form for a whole worklist in one pass'},\n        {t:'New form in 48 hours', d:'send the PDF you fill most and we map it, usually before your demo'}\n      ],\n\n      libRows: [\n        {name:'ctdssmap XOLAIR PA', meta:'CT Medicaid · prior_authorization', tag:'READY', fg:'#2f6b48', bg:'#e8f3ec'},\n        {name:'aetna az-prescription-drug', meta:'aetna · prior_authorization · AZ', tag:'READY', fg:'#2f6b48', bg:'#e8f3ec'},\n        {name:'bcbstx medicaid-rx-pa-request', meta:'bcbstx · prior_authorization · TX', tag:'READY', fg:'#2f6b48', bg:'#e8f3ec'},\n        {name:'bcbsnm nm-uniform-pa', meta:'bcbsnm · prior_authorization · NM', tag:'READY', fg:'#2f6b48', bg:'#e8f3ec'},\n        {name:'cigna commercial-pa', meta:'cigna · prior_authorization · US', tag:'MAPPING', fg:'#a1622a', bg:'#fdf1e2'}\n      ],\n\n      faqs: [\n        {q:'Does it work on a payer form you have never seen?', a:'Yes. Upload it and the fields are detected automatically; anything ambiguous we map by hand and lock, usually within 48 hours.'},\n        {q:'How is this different from typing into a PDF reader?', a:'Your saved profiles fill the repeating identity fields on open, the guided pane asks only what is left, and the answers land on the real page live — so there is no separate proofreading pass and no drift when the payer reissues the PDF.'},\n        {q:'Who signs the form?', a:'The prescriber. Coordinators can fill and stage a form, but the signature is applied by the signing user with consent recorded under ESIGN and UETA.'},\n        {q:'Can we fill one form for a whole worklist?', a:'Upload a CSV and the same mapped form is filled once per row, with each result available as its own flattened PDF.'},\n        {q:'What does it cost?', a:'Per-seat, billed monthly, with mapping of your existing forms included. Pricing is confirmed on the demo call.'}\n      ].map((f, i) => ({\n        q:f.q, a:f.a, open: st.faq === i, sign: st.faq === i ? '–' : '+',\n        toggle: () => this.setState({faq: st.faq === i ? -1 : i})\n      }))\n    };\n  }\n  submit(ok) {\n    if (!ok) { this.setState({err:true}); return; }\n    this.setState({sent:true, err:false});\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
