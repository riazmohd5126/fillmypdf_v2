name: CI

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pdf2image is imported by some pipelines; avoids optional runtime failures later.
      # tesseract-ocr matches the app Dockerfile (card OCR). libreoffice-writer
      # also matches it — needed for a real (not mocked) docx-to-pdf conversion
      # test of the Image & Word to PDF tool.
      - name: Install poppler, tesseract and LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr libreoffice-writer

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          BCRYPT_ROUNDS: "4"
          DEBUG: "True"
          PROFILES_ENCRYPTION_KEY: test-key-32-bytes-long-aaaaaaaaaa
        run: python -m pytest tests/ -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fillmypdf:ci
